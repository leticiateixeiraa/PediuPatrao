# Configurando a conex\u00e3o com MongoDB enquanto reposit\u00f3rio de dados
# Padrao: MongoDB local. Para Atlas ou outro servidor use as variaveis MONGODB_URI e MONGODB_DATABASE
spring.data.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017}
spring.data.mongodb.database=${MONGODB_DATABASE:pediupatrao_m1p2}

spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.mode=HTML
spring.thymeleaf.cache=false

logging.level.com.umc.pediupatrao=INFO

server.error.include-message=always
server.error.include-stacktrace=never
# Gera pedidos de demonstracao (ultimos 45 dias) para o dashboard. Ligar com DEMO_DATA=true
app.demo-data=${DEMO_DATA:false}
