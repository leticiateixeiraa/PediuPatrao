<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
    <head>
        <meta charset="UTF-8">
        <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet">
    </head>
    <body>
        <div th:fragment="sidebar">
            <div id="sidebar" class="d-flex flex-column">
                <h4 class="text-center py-3">Pediu Patrão</h4>

                <!-- usuario logado e perfil -->
                <div class="px-3 pb-3 small text-white-50" sec:authorize="isAuthenticated()">
                    <i class="bi bi-person-circle"></i>
                    <span sec:authentication="name"></span>
                    <span class="badge bg-danger ms-1" sec:authorize="hasRole('ADMIN')">ADMIN</span>
                    <span class="badge bg-warning text-dark ms-1" sec:authorize="hasRole('GERENTE')">GERENTE</span>
                    <span class="badge bg-secondary ms-1" sec:authorize="hasRole('ATENDENTE')">ATENDENTE</span>
                </div>

                <!-- Os itens abaixo so aparecem para quem tem acesso, mas a regra
                     de verdade esta no SecurityConfig (backend) -->
                <ul class="nav flex-column">
                    <li class="nav-item">
                        <a class="nav-link" th:href="@{/}" aria-current="page">
                            <i class="bi bi-house"></i><span class="d-none d-md-inline">&nbsp;Home</span>
                        </a>
                    </li>
                    <li class="nav-item" sec:authorize="hasAnyRole('GERENTE','ATENDENTE')">
                        <a class="nav-link" th:href="@{/clientes}">
                            <i class="bi bi-person-raised-hand"></i><span class="d-none d-md-inline">&nbsp;Clientes</span>
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" th:href="@{/pedidos}">
                            <i class="bi bi-bag"></i><span class="d-none d-md-inline">&nbsp;Pedidos</span>
                        </a>
                    </li>
                    <li class="nav-item" sec:authorize="hasAnyRole('ADMIN','GERENTE')">
                        <a class="nav-link" th:href="@{/auditoria}">
                            <i class="bi bi-search"></i><span class="d-none d-md-inline">&nbsp;Auditoria</span>
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="#" onclick="toggleSubmenu(event, this)">
                            <i class="bi bi-gear"></i><span class="d-none d-md-inline">&nbsp;Configurações</span>
                            <span class="float-end">&#9662;</span> <!-- Setinha -->
                        </a>
                        <ul class="nav flex-column submenu">
                            <li class="nav-item">
                                <a class="nav-link" th:href="@{/funcionarios}">
                                    <i class="bi bi-person-walking"></i><span class="d-none d-md-inline">&nbsp;Funcionários</span>
                                </a>
                            </li>
                            <li class="nav-item">
                                <a class="nav-link" th:href="@{/entregadores}">
                                    <i class="bi bi-bicycle"></i><span class="d-none d-md-inline">&nbsp;Entregadores</span>
                                </a>
                            </li>
                            <li class="nav-item">
                                <a class="nav-link" th:href="@{/horarios}">
                                    <i class="bi bi-clock"></i><span class="d-none d-md-inline">&nbsp;Horário de Funcionamento</span>
                                </a>
                            </li>
                            <li class="nav-item">
                                <a class="nav-link" th:href="@{/produtos}">
                                    <i class="bi bi-boxes"></i><span class="d-none d-md-inline">&nbsp;Produtos</span>
                                </a>
                            </li>
                            <li class="nav-item" sec:authorize="hasRole('ADMIN')">
                                <a class="nav-link" th:href="@{/usuarios}">
                                    <i class="bi bi-people-fill"></i><span class="d-none d-md-inline">&nbsp;Usuários</span>
                                </a>
                            </li>
                        </ul>
                    </li>
                </ul>

                <!-- logout precisa ser POST por causa do CSRF -->
                <form th:action="@{/logout}" method="post" class="mt-auto p-3" sec:authorize="isAuthenticated()">
                    <button type="submit" class="btn btn-outline-light btn-sm w-100">
                        <i class="bi bi-box-arrow-right"></i> Sair
                    </button>
                </form>
            </div>
        </div>
    </body>
</html>
