<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <title>Lista de Clientes</title>
</head>
<body>
<div th:fragment="content">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2 class="fw-bold mb-0">
            <i class="bi bi-person-raised-hand me-2 text-primary"></i>Clientes
        </h2>
        <a href="/clientes/novo" class="btn btn-primary" sec:authorize="hasRole('ATENDENTE')">
            <i class="bi bi-plus-lg me-1"></i> Novo Cliente
        </a>
    </div>

    <!-- Tabela de clientes -->
    <div class="card shadow-sm">
        <div class="card-body p-0">
            <table class="table table-hover align-middle mb-0">
                <thead class="table-dark">
                    <tr>
                        <th>Nome</th>
                        <th>Telefone</th>
                        <th>Endereço</th>
                        <th class="text-end pe-4">Ações</th>
                    </tr>
                </thead>
                <tbody id="clientes-tabela">
                    <!-- Linhas carregadas via JavaScript -->
                </tbody>
            </table>
        </div>
    </div>

    <div class="alert alert-success alert-dismissible fade show mt-3" th:if="${sucesso}" role="alert">
        <span th:text="${sucesso}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>
    <div class="alert alert-danger alert-dismissible fade show mt-3" th:if="${erro}" role="alert">
        <span th:text="${erro}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>

    <script th:inline="javascript">
        const API_URL = '/api/clientes';
        // so controla o que aparece na tela; quem bloqueia de fato e o backend
        const podeEditar = /*[[${#authorization.expression('hasRole(''ATENDENTE'')')}]]*/ false;
        const podeExcluir = /*[[${#authorization.expression('hasRole(''GERENTE'')')}]]*/ false;
        const tabelaClientes = document.getElementById('clientes-tabela');

        function formatarEndereco(cliente) {
            const partes = [
                cliente.logradouro,
                cliente.numero,
                cliente.complemento,
                cliente.bairro,
                cliente.cidade,
                cliente.estado
            ].filter(p => p && p.trim() !== '');

            return partes.length > 0 ? partes.join(', ') : (cliente.endereco || '—');
        }

        async function carregarClientes() {
            let clientes = [];
            try {
                clientes = await apiFetch(API_URL);
            } catch (e) {
                tabelaClientes.innerHTML = `<tr><td colspan="4" class="text-danger p-4">${escapeHtml(e.message)}</td></tr>`;
                return;
            }
            tabelaClientes.innerHTML = '';

            if (clientes.length === 0) {
                tabelaClientes.innerHTML = `
                    <tr>
                        <td colspan="4" class="text-center text-muted py-5">
                            <i class="bi bi-inbox fs-3 d-block mb-2"></i>
                            Nenhum cliente cadastrado.
                        </td>
                    </tr>`;
                return;
            }

            clientes.forEach(cliente => {
                const row = document.createElement('tr');
                row.innerHTML = `
                    <td>${escapeHtml(cliente.nome) || '—'}</td>
                    <td>${escapeHtml(cliente.telefone) || '—'}</td>
                    <td>${escapeHtml(formatarEndereco(cliente))}</td>
                    <td class="text-end pe-4">
                        ${podeEditar ? `<a href="/clientes/editar/${encodeURIComponent(cliente.id)}" class="btn btn-sm btn-outline-primary me-1">
                            <i class="bi bi-pencil-fill"></i> Editar
                        </a>` : ''}
                        ${podeExcluir ? `<button class="btn btn-sm btn-outline-danger" onclick="excluirCliente('${escapeHtml(cliente.id)}')">
                            <i class="bi bi-trash-fill"></i> Excluir
                        </button>` : ''}
                    </td>
                `;
                tabelaClientes.appendChild(row);
            });
        }

        async function excluirCliente(id) {
            if (confirm('Tem certeza que deseja excluir este cliente?')) {
                try {
                    await apiFetch(`${API_URL}/${encodeURIComponent(id)}`, { method: 'DELETE' });
                    alert('Cliente excluído com sucesso!');
                    carregarClientes();
                } catch (e) {
                    alert('Erro ao excluir o cliente: ' + e.message);
                }
            }
        }

        carregarClientes();
    </script>
</div>
</body>
</html>
