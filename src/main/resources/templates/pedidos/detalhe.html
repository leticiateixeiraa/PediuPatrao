<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <title>Pedido</title>
</head>
<body>

<div th:fragment="content">

    <div class="d-flex align-items-center gap-3 mb-4">
        <a th:href="@{/pedidos}" class="btn btn-outline-secondary btn-sm">
            <i class="bi bi-arrow-left"></i>
        </a>
        <h2 class="fw-bold mb-0">
            Pedido <small class="text-muted fs-6 font-monospace" th:text="${pedido.id}"></small>
        </h2>
        <span class="badge fs-6"
              th:classappend="${pedido.status?.name() == 'CANCELADO'} ? 'bg-danger' :
                              (${pedido.status?.name() == 'FINALIZADO'} ? 'bg-success' : 'bg-primary')"
              th:text="${pedido.status?.descricao}"></span>
    </div>

    <div class="row g-3">
        <div class="col-lg-7">
            <div class="card shadow-sm">
                <div class="card-header fw-medium">Itens</div>
                <div class="card-body p-0">
                    <table class="table mb-0">
                        <thead>
                            <tr><th class="ps-3">Produto</th><th>Qtd.</th><th class="text-end">Preço un.</th><th class="text-end pe-3">Subtotal</th></tr>
                        </thead>
                        <tbody>
                            <tr th:each="item : ${pedido.itens}">
                                <td class="ps-3" th:text="${item.nomeProduto}"></td>
                                <td th:text="${item.quantidade}"></td>
                                <td class="text-end" th:text="${'R$ ' + #numbers.formatDecimal(item.precoUnitario, 1, 'POINT', 2, 'COMMA')}"></td>
                                <td class="text-end pe-3" th:text="${'R$ ' + #numbers.formatDecimal(item.subtotal, 1, 'POINT', 2, 'COMMA')}"></td>
                            </tr>
                        </tbody>
                        <tfoot>
                            <tr>
                                <td colspan="3" class="text-end ps-3">Subtotal</td>
                                <td class="text-end pe-3" th:text="${'R$ ' + #numbers.formatDecimal(pedido.subtotal, 1, 'POINT', 2, 'COMMA')}"></td>
                            </tr>
                            <tr th:if="${pedido.valorDesconto != null and pedido.valorDesconto.signum() > 0}">
                                <td colspan="3" class="text-end text-success"
                                    th:text="${'Desconto (' + #numbers.formatDecimal(pedido.percentualDesconto, 1, 'POINT', 2, 'COMMA') + '%)'}"></td>
                                <td class="text-end pe-3 text-success" th:text="${'- R$ ' + #numbers.formatDecimal(pedido.valorDesconto, 1, 'POINT', 2, 'COMMA')}"></td>
                            </tr>
                            <tr class="fw-bold">
                                <td colspan="3" class="text-end">Total</td>
                                <td class="text-end pe-3" th:text="${'R$ ' + #numbers.formatDecimal(pedido.valorTotal, 1, 'POINT', 2, 'COMMA')}"></td>
                            </tr>
                        </tfoot>
                    </table>
                </div>
            </div>

            <div class="card shadow-sm mt-3" th:if="${pedido.observacao != null}">
                <div class="card-body"><strong>Observação:</strong> <span th:text="${pedido.observacao}"></span></div>
            </div>

            <div class="alert alert-danger mt-3" th:if="${pedido.status?.name() == 'CANCELADO'}">
                <strong>Cancelado</strong> por <span th:text="${pedido.canceladoPor}"></span>
                em <span th:text="${#temporals.format(pedido.dataHoraCancelamento, 'dd/MM/yyyy HH:mm')}"></span>.<br>
                Justificativa: <em th:text="${pedido.justificativaCancelamento}"></em>
            </div>
        </div>

        <div class="col-lg-5">
            <div class="card shadow-sm">
                <div class="card-header fw-medium">Dados</div>
                <ul class="list-group list-group-flush small">
                    <li class="list-group-item"><strong>Cliente:</strong> <span th:text="${pedido.clienteNome}"></span></li>
                    <li class="list-group-item"><strong>Tipo:</strong> <span th:text="${pedido.tipoEntrega}"></span></li>
                    <li class="list-group-item">
                        <strong>Entrada:</strong>
                        <span th:text="${#temporals.format(pedido.dataHoraEntrada, 'dd/MM/yyyy HH:mm')}"></span>
                        por <span th:text="${pedido.registradoPor}"></span>
                    </li>
                    <li class="list-group-item">
                        <strong>Saída:</strong>
                        <th:block th:if="${pedido.dataHoraSaida != null}">
                            <span th:text="${#temporals.format(pedido.dataHoraSaida, 'dd/MM/yyyy HH:mm')}"></span>
                            por <span th:text="${pedido.saidaRegistradaPor}"></span>
                        </th:block>
                        <span th:if="${pedido.dataHoraSaida == null}" class="text-muted">ainda não saiu</span>
                    </li>
                    <li class="list-group-item" th:if="${pedido.descontoAplicadoPor != null}">
                        <strong>Desconto:</strong> por <span th:text="${pedido.descontoAplicadoPor}"></span>
                        em <span th:text="${#temporals.format(pedido.dataHoraDesconto, 'dd/MM/yyyy HH:mm')}"></span>
                    </li>
                </ul>
                <div class="card-body d-flex flex-wrap gap-2">
                    <th:block sec:authorize="hasAnyRole('GERENTE','ATENDENTE')">
                        <button type="button" class="btn btn-sm btn-primary"
                                th:if="${pedido.proximoStatus != null}"
                                th:data-id="${pedido.id}" th:data-proximo="${pedido.proximoStatus.descricao}"
                                onclick="avancarPedido(this.dataset.id, this.dataset.proximo)">
                            <i class="bi bi-arrow-right"></i> <span th:text="${pedido.proximoStatus.descricao}"></span>
                        </button>
                    </th:block>
                    <th:block sec:authorize="hasRole('GERENTE')"
                              th:if="${pedido.status != null and pedido.status.permiteCancelamentoOuDesconto()}">
                        <button type="button" class="btn btn-sm btn-outline-warning"
                                th:data-id="${pedido.id}" onclick="descontoPedido(this.dataset.id)">
                            <i class="bi bi-percent"></i> Desconto
                        </button>
                        <button type="button" class="btn btn-sm btn-outline-danger"
                                th:data-id="${pedido.id}" onclick="cancelarPedido(this.dataset.id)">
                            <i class="bi bi-x-circle"></i> Cancelar
                        </button>
                    </th:block>
                    <a sec:authorize="hasAnyRole('ADMIN','GERENTE')" class="btn btn-sm btn-outline-secondary"
                       th:href="@{/auditoria(entidade='PEDIDO',entidadeId=${pedido.id})}">
                        <i class="bi bi-search"></i> Ver auditoria
                    </a>
                </div>
            </div>

            <div class="card shadow-sm mt-3">
                <div class="card-header fw-medium">Linha do tempo</div>
                <ul class="list-group list-group-flush small">
                    <li class="list-group-item d-flex justify-content-between" th:each="h : ${pedido.historico}">
                        <span th:text="${h.status?.descricao}"></span>
                        <span class="text-muted">
                            <span th:text="${#temporals.format(h.dataHora, 'dd/MM HH:mm')}"></span>
                            · <span th:text="${h.usuario}"></span>
                        </span>
                    </li>
                </ul>
            </div>
        </div>
    </div>

    <script th:src="@{/js/pedidos.js}"></script>
</div>

</body>
</html>
