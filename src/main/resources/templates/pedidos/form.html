<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Novo Pedido</title>
</head>
<body>

<div th:fragment="content">

    <div class="d-flex align-items-center gap-3 mb-4">
        <a th:href="@{/pedidos}" class="btn btn-outline-secondary btn-sm">
            <i class="bi bi-arrow-left"></i>
        </a>
        <h2 class="fw-bold mb-0">Novo Pedido</h2>
    </div>

    <div class="alert alert-danger d-none" id="erroPedido"></div>

    <div class="card shadow-sm" style="max-width: 820px;">
        <div class="card-body p-4">
            <form id="formPedido">
                <div class="row mb-3">
                    <div class="col-md-8">
                        <label for="clienteId" class="form-label fw-medium">
                            <i class="bi bi-person me-1"></i>Cliente
                        </label>
                        <select id="clienteId" class="form-select" required>
                            <option value="">Selecione o cliente</option>
                            <option th:each="c : ${clientes}" th:value="${c.id}"
                                    th:text="${c.nome + (c.telefone != null ? ' — ' + c.telefone : '')}"></option>
                        </select>
                    </div>
                    <div class="col-md-4">
                        <label class="form-label fw-medium"><i class="bi bi-truck me-1"></i>Tipo</label>
                        <div>
                            <div class="form-check form-check-inline">
                                <input class="form-check-input" type="radio" name="tipoEntrega" id="tipoEntrega" value="ENTREGA" checked>
                                <label class="form-check-label" for="tipoEntrega">Entrega</label>
                            </div>
                            <div class="form-check form-check-inline">
                                <input class="form-check-input" type="radio" name="tipoEntrega" id="tipoRetirada" value="RETIRADA">
                                <label class="form-check-label" for="tipoRetirada">Retirada</label>
                            </div>
                        </div>
                    </div>
                </div>

                <p class="fw-medium mb-2"><i class="bi bi-basket me-1"></i>Itens</p>
                <table class="table table-sm align-middle">
                    <thead>
                        <tr>
                            <th>Produto</th>
                            <th style="width: 110px;">Qtd.</th>
                            <th style="width: 130px;" class="text-end">Subtotal*</th>
                            <th style="width: 50px;"></th>
                        </tr>
                    </thead>
                    <tbody id="itens"></tbody>
                </table>
                <button type="button" class="btn btn-sm btn-outline-primary mb-3" id="btnAddItem">
                    <i class="bi bi-plus"></i> Adicionar item
                </button>

                <div class="mb-3">
                    <label for="observacao" class="form-label fw-medium">Observação</label>
                    <textarea id="observacao" class="form-control" rows="2" maxlength="300"
                              placeholder="Ex: sem cebola, troco para 100"></textarea>
                </div>

                <div class="d-flex justify-content-between align-items-center">
                    <div>
                        <span class="text-muted">Total estimado*:</span>
                        <strong class="fs-5" id="totalEstimado">R$ 0,00</strong>
                        <div class="small text-muted">* prévia na tela; o valor oficial é calculado pelo servidor.</div>
                    </div>
                    <div class="d-flex gap-2">
                        <a th:href="@{/pedidos}" class="btn btn-outline-secondary">Cancelar</a>
                        <button type="submit" class="btn btn-primary" id="btnSalvar">
                            <i class="bi bi-check-lg me-1"></i> Registrar pedido
                        </button>
                    </div>
                </div>
            </form>
        </div>
    </div>

    <!-- lista de produtos so para montar o select e a previa -->
    <script th:inline="javascript">
        const PRODUTOS = /*[[${produtos}]]*/ [];
    </script>
    <script>
        const tbody = document.getElementById('itens');
        const fmt = v => 'R$ ' + v.toFixed(2).replace('.', ',');

        function opcoesProdutos() {
            return '<option value="">Selecione</option>' + PRODUTOS.map(p =>
                `<option value="${escapeHtml(p.id)}">${escapeHtml(p.nome)} — ${fmt(Number(p.preco))}</option>`
            ).join('');
        }

        function adicionarItem() {
            const tr = document.createElement('tr');
            tr.innerHTML = `
                <td><select class="form-select form-select-sm produto" required>${opcoesProdutos()}</select></td>
                <td><input type="number" class="form-control form-control-sm quantidade" min="1" max="50" value="1" required></td>
                <td class="text-end subtotal">R$ 0,00</td>
                <td><button type="button" class="btn btn-sm btn-outline-danger remover"><i class="bi bi-trash"></i></button></td>`;
            tbody.appendChild(tr);
            tr.querySelector('.remover').addEventListener('click', () => { tr.remove(); atualizarTotal(); });
            tr.querySelector('.produto').addEventListener('change', atualizarTotal);
            tr.querySelector('.quantidade').addEventListener('input', atualizarTotal);
        }

        function atualizarTotal() {
            let total = 0;
            tbody.querySelectorAll('tr').forEach(tr => {
                const produto = PRODUTOS.find(p => p.id === tr.querySelector('.produto').value);
                const qtd = parseInt(tr.querySelector('.quantidade').value || '0', 10);
                const sub = produto ? Number(produto.preco) * qtd : 0;
                tr.querySelector('.subtotal').textContent = fmt(sub);
                total += sub;
            });
            document.getElementById('totalEstimado').textContent = fmt(total);
        }

        document.getElementById('btnAddItem').addEventListener('click', adicionarItem);

        document.getElementById('formPedido').addEventListener('submit', async (ev) => {
            ev.preventDefault();
            const erro = document.getElementById('erroPedido');
            erro.classList.add('d-none');

            // manda so produto e quantidade - preco/total quem calcula e o servidor
            const pedido = {
                clienteId: document.getElementById('clienteId').value,
                tipoEntrega: document.querySelector('input[name="tipoEntrega"]:checked').value,
                observacao: document.getElementById('observacao').value,
                itens: Array.from(tbody.querySelectorAll('tr')).map(tr => ({
                    produtoId: tr.querySelector('.produto').value,
                    quantidade: parseInt(tr.querySelector('.quantidade').value, 10)
                }))
            };

            const btn = document.getElementById('btnSalvar');
            btn.disabled = true;
            try {
                const criado = await apiFetch('/api/pedidos', { method: 'POST', body: pedido });
                window.location.href = '/pedidos/' + encodeURIComponent(criado.id);
            } catch (e) {
                erro.textContent = e.message;
                erro.classList.remove('d-none');
                btn.disabled = false;
            }
        });

        adicionarItem();
    </script>
</div>

</body>
</html>
